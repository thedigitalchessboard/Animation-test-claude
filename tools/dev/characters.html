<!doctype html>
<html><head><meta charset="utf-8"><title>TDC character sheet</title>
<style>body{margin:0;background:#0B1E3D}svg{width:100vw;height:100vh;display:block}</style></head>
<body>
<svg id="s" viewBox="0 0 1600 1100"></svg>
<script type="module">
import { createCoach, COACH_POSES } from '../../tdc-cinematic/src/art/coach.js';
import { createGirl, KIDS } from '../../tdc-cinematic/src/art/girl.js';
import { createAstronaut } from '../../tdc-cinematic/src/art/astronaut.js';
const svg = document.getElementById('s');
const add = (rig, st) => { svg.appendChild(rig.root); Object.assign(rig.state, st); rig.apply(null, 0.3); return rig; };
const poses = [
  ['catch', { handOpenR: 1, mO: 1, mSmile: 0 }], ['place', { mProud: 1, mSmile: 0 }],
  ['apology', { handOpenL: 1, handOpenR: 1, mEek: 1, mSmile: 0, browTilt: 15, lid: 0.5, rot: -14 }],
  ['shh', { handPointR: 1, mSmile: 0, mProud: 1 }], ['peek', { handOpenL: 1, lookX: -1 }], ['knock', { handPointL: 1 }],
  ['heart', { handOpenR: 1, mProud: 1, mSmile: 0, lid: 0.35 }], ['salute', { handOpenR: 1 }],
];
poses.forEach(([n, extra], i) => add(createCoach(), { ...COACH_POSES[n], x: 100 + i * 190, y: 250, scale: 0.5, ...extra }));
add(createCoach({ variant: 'mentor' }), { ...COACH_POSES.wave, handOpenR: 1, x: 1560, y: 250, scale: 0.5 });
Object.values(KIDS).forEach((k, i) => add(createGirl(k), { x: 90 + i * 130, y: 640, scale: 0.55, lid: 0, mSleepy: 0, mSmile: 1 }));
add(createGirl(), { x: 900, y: 640, scale: 0.55, lid: 0, mSleepy: 0, mYawn: 1, armL: 165, armR: 165, foreL: 5, foreR: 5 });
add(createGirl(), { x: 1040, y: 640, scale: 0.55, lid: 0.6, mSleepy: 1, armR: 4, foreR: -166 });
add(createGirl(), { x: 1180, y: 640, scale: 0.55, lid: 0.2, mSleepy: 0, mSmile: 1, armR: 140, foreR: 60, sparkle: 1 });
add(createAstronaut({ logoUrl: '../../tdc-cinematic/assets/brand/tdc-logo-horizontal-light.webp' }), { x: 200, y: 1000, scale: 1 });
add(createAstronaut({ tablet: false, skin: '#E9BFA0', hair: '#C58A45' }), { x: 450, y: 1000, scale: 1, flipX: -1 });
add(createAstronaut({ tablet: false, skin: '#E9BFA0', hair: '#C58A45' }), { x: 700, y: 1000, scale: 1, flipX: -1, armR: -40, foreR: 70, thumb: 1, mSoft: 0, mGrin: 1 });
</script></body></html>
