<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Little Chess Dream</title>
<style>
  :root{
    --ink:#0b1020;
    --gold:#f4c95d;
    --glow:#fff6d8;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    height:100%;
    background:var(--ink);
    font-family:'Segoe UI', system-ui, sans-serif;
    overflow:hidden;
  }
  #stage{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:radial-gradient(ellipse at center, #131a33 0%, #060812 80%);
  }

  .scene{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    transform:scale(1.15);
    transition:opacity 1.1s ease, transform 1.4s ease;
    pointer-events:none;
  }
  .scene.active{
    opacity:1;
    transform:scale(1);
    pointer-events:auto;
  }
  .scene.zoom-out.active{
    transform:scale(1);
  }
  .scene.leaving{
    opacity:0;
    transform:scale(2.6);
  }

  /* ---------- caption ---------- */
  #caption{
    position:absolute;
    left:0; right:0;
    bottom:6%;
    text-align:center;
    color:var(--glow);
    font-size:1.05rem;
    letter-spacing:.04em;
    text-shadow:0 0 12px rgba(255,240,200,.5);
    opacity:0;
    transition:opacity .8s ease;
    z-index:50;
    pointer-events:none;
  }
  #caption.show{opacity:1;}

  /* ---------- SCENE 1: globe ---------- */
  #globe-wrap{
    position:relative;
    width:min(60vmin,420px);
    height:min(60vmin,420px);
  }
  .stars-bg{
    position:absolute; inset:-50%;
    background-image:
      radial-gradient(1.5px 1.5px at 10% 20%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 80% 10%, #fff, transparent),
      radial-gradient(1px 1px at 60% 70%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 30% 80%, #fff, transparent),
      radial-gradient(1px 1px at 90% 60%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 45% 40%, #fff, transparent),
      radial-gradient(1px 1px at 15% 55%, #fff, transparent),
      radial-gradient(1px 1px at 70% 90%, #fff, transparent);
    background-size:200% 200%;
    animation:twinkle 4s ease-in-out infinite alternate;
    opacity:.7;
  }
  @keyframes twinkle{
    from{opacity:.35;}
    to{opacity:.9;}
  }
  #globe{
    position:absolute; inset:0;
    border-radius:50%;
    background:
      radial-gradient(circle at 35% 30%, #3d7dd8 0%, #2a5fb0 35%, #1c4488 60%, #0e2a5e 100%);
    box-shadow:
      inset -20px -20px 60px rgba(0,0,0,.55),
      inset 10px 10px 40px rgba(255,255,255,.15),
      0 0 60px rgba(80,140,255,.35);
    overflow:hidden;
  }
  #globe .land{
    position:absolute;
    inset:-10%;
    background-image:
      radial-gradient(circle, #2f8f5b 0 6px, transparent 7px);
    background-size:34px 34px;
    background-position:0 0;
    opacity:.55;
    animation:spin-globe 9s linear infinite;
  }
  @keyframes spin-globe{
    from{ background-position:0 0; }
    to{ background-position:-340px 0; }
  }
  #globe .shade{
    position:absolute; inset:0;
    border-radius:50%;
    background:radial-gradient(circle at 65% 70%, transparent 40%, rgba(0,0,0,.5) 100%);
  }
  .marker{
    position:absolute;
    width:14px; height:14px;
    margin:-7px 0 0 -7px;
    border-radius:50%;
    background:var(--gold);
    box-shadow:0 0 10px 4px rgba(244,201,93,.9);
    animation:pulse-marker 1.3s ease-in-out infinite;
    z-index:5;
  }
  @keyframes pulse-marker{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.6); }
  }
  .beam{
    position:absolute;
    width:3px;
    background:linear-gradient(to top, rgba(244,201,93,1), rgba(244,201,93,0));
    transform-origin:bottom center;
    opacity:0;
    z-index:4;
  }
  .beam.fly{
    animation:beam-up 1.4s ease-in forwards;
  }
  @keyframes beam-up{
    0%{ opacity:1; height:0; }
    70%{ opacity:1; }
    100%{ opacity:0; height:340px; }
  }

  /* ---------- SCENE 2: house at night ---------- */
  #scene-house .night-sky{
    position:absolute; inset:0;
    background:linear-gradient(to bottom, #0a1230 0%, #16204a 55%, #202b55 100%);
  }
  .moon{
    position:absolute;
    top:8%; right:14%;
    width:70px; height:70px;
    border-radius:50%;
    background:#fff8de;
    box-shadow:0 0 40px 12px rgba(255,248,222,.55);
  }
  .twinkle-star{
    position:absolute;
    width:3px; height:3px;
    background:#fff;
    border-radius:50%;
    animation:star-blink 2.4s ease-in-out infinite;
  }
  @keyframes star-blink{
    0%,100%{ opacity:.2; }
    50%{ opacity:1; }
  }
  .house{
    position:absolute;
    bottom:0; left:50%;
    transform:translateX(-50%);
    width:280px;
  }
  .roof{
    width:0; height:0;
    border-left:150px solid transparent;
    border-right:150px solid transparent;
    border-bottom:90px solid #7a3b2e;
    margin:0 auto;
  }
  .walls{
    width:220px;
    height:150px;
    background:#c98a55;
    margin:0 auto;
    position:relative;
    border-radius:0 0 4px 4px;
  }
  .door{
    position:absolute;
    bottom:0; left:50%;
    transform:translateX(-50%);
    width:46px; height:80px;
    background:#4b2c20;
    border-radius:6px 6px 0 0;
  }
  .window{
    position:absolute;
    top:26px; left:26px;
    width:54px; height:54px;
    background:var(--gold);
    box-shadow:0 0 30px 10px rgba(244,201,93,.85);
    border-radius:4px;
    animation:window-glow 2.4s ease-in-out infinite;
  }
  @keyframes window-glow{
    0%,100%{ box-shadow:0 0 22px 6px rgba(244,201,93,.65); }
    50%{ box-shadow:0 0 34px 14px rgba(244,201,93,.95); }
  }
  .window.right{ left:auto; right:26px; }

  /* ---------- SCENE 3: bedroom ---------- */
  #scene-room{
    background:linear-gradient(to bottom, #241a3d 0%, #2e2350 60%, #3a2c5c 100%);
  }
  .room-inner{
    position:relative;
    width:min(90vmin, 640px);
    height:min(90vmin, 640px);
    max-height:92vh;
  }
  .wallpaper{
    position:absolute;
    top:0; left:0; right:0;
    height:62%;
    background-image:
      linear-gradient(45deg, #efe6d8 25%, transparent 25%),
      linear-gradient(-45deg, #efe6d8 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #efe6d8 75%),
      linear-gradient(-45deg, transparent 75%, #efe6d8 75%);
    background-size:44px 44px;
    background-position:0 0, 0 22px, 22px -22px, -22px 0px;
    background-color:#3b2f57;
    border-radius:10px 10px 0 0;
    box-shadow:inset 0 0 60px rgba(0,0,0,.35);
  }
  .wallpaper .frame-glow{
    position:absolute;
    inset:0;
    border-radius:10px 10px 0 0;
    background:radial-gradient(circle at 70% 35%, rgba(244,201,93,0) 0%, rgba(244,201,93,0) 100%);
    transition:background 1s ease;
  }
  .wallpaper.spotlight .frame-glow{
    background:radial-gradient(circle at 70% 38%, rgba(244,201,93,.55) 0%, rgba(244,201,93,0) 55%);
  }
  .chess-piece{
    position:absolute;
    font-size:2.6rem;
    color:#241a3d;
    opacity:.85;
    filter:drop-shadow(0 0 2px rgba(0,0,0,.25));
    transition:transform .6s ease, filter 1s ease, color 1s ease;
  }
  .wallpaper.spotlight .chess-piece.hero{
    transform:scale(1.35) rotate(-6deg);
    color:#7a3bd1;
    filter:drop-shadow(0 0 10px rgba(244,201,93,.9));
  }
  .sparkle{
    position:absolute;
    width:22px; height:22px;
    opacity:0;
    pointer-events:none;
    filter:drop-shadow(0 0 6px rgba(244,201,93,.95)) drop-shadow(0 0 2px #fff);
    z-index:10;
  }
  .sparkle::before, .sparkle::after{
    content:'';
    position:absolute;
    background:var(--gold);
    border-radius:2px;
  }
  .sparkle::before{
    left:50%; top:0; bottom:0; width:4px; transform:translateX(-50%);
  }
  .sparkle::after{
    top:50%; left:0; right:0; height:4px; transform:translateY(-50%);
  }
  .sparkle.pop{
    animation:sparkle-pop 1.1s ease-out forwards;
  }
  @keyframes sparkle-pop{
    0%{ opacity:0; transform:scale(.2) rotate(0deg); }
    40%{ opacity:1; transform:scale(1.3) rotate(45deg); }
    100%{ opacity:0; transform:scale(.4) rotate(90deg); }
  }

  .bed{
    position:absolute;
    bottom:6%; left:50%;
    transform:translateX(-50%);
    width:78%;
    height:30%;
  }
  .bed .frame{
    position:absolute; inset:0;
    background:#5b3a29;
    border-radius:14px;
  }
  .bed .mattress{
    position:absolute;
    left:4%; right:4%; top:14%; bottom:6%;
    background:#f4ede1;
    border-radius:12px;
  }
  .bed .blanket{
    position:absolute;
    left:4%; right:4%; bottom:6%; height:62%;
    background:#5b6ee1;
    border-radius:12px;
    box-shadow:inset 0 6px 10px rgba(0,0,0,.15);
    transition:height .8s ease, transform .8s ease;
  }
  .bed.awake .blanket{
    height:40%;
    transform:translateY(6px);
  }
  .pillow{
    position:absolute;
    left:8%; bottom:34%;
    width:30%; height:26%;
    background:#fff;
    border-radius:40%;
    box-shadow:0 4px 8px rgba(0,0,0,.15);
  }

  .kid{
    position:absolute;
    left:16%; bottom:34%;
    width:120px;
    transition:transform 1s ease;
    transform-origin:bottom center;
  }
  .bed.awake .kid{
    transform:translateY(-14px) rotate(-4deg);
  }
  .kid .head{
    width:74px; height:74px;
    border-radius:50%;
    background:#f2c29b;
    margin:0 auto;
    position:relative;
  }
  .kid .hair-back{
    position:absolute;
    top:-6px; left:-6px; right:-6px;
    height:50px;
    background:#3c2415;
    border-radius:50% 50% 0 0;
  }
  .pigtail{
    position:absolute;
    top:18px;
    width:20px; height:34px;
    background:#3c2415;
    border-radius:50%;
  }
  .pigtail.left{ left:-14px; transform:rotate(-18deg); }
  .pigtail.right{ right:-14px; transform:rotate(18deg); }

  .eye{
    position:absolute;
    top:34px;
    width:16px; height:16px;
  }
  .eye.left{ left:14px; }
  .eye.right{ right:14px; }
  .eye .lid{
    position:absolute; inset:0;
    background:#f2c29b;
    border-bottom:2.5px solid #7a4a2e;
    border-radius:2px;
    transform-origin:top;
    transition:transform 1.2s cubic-bezier(.2,1.4,.4,1);
  }
  .eye .ball{
    position:absolute;
    inset:0;
    border-radius:50%;
    background:#fff;
    opacity:0;
    transition:opacity .4s ease .5s;
  }
  .eye .ball::after{
    content:'';
    position:absolute;
    width:8px; height:8px;
    background:#241a3d;
    border-radius:50%;
    top:4px; left:4px;
    box-shadow:0 0 4px 1px rgba(244,201,93,.9);
  }
  .kid.awake .lid{
    transform:scaleY(0.05) translateY(0);
  }
  .kid.awake .ball{
    opacity:1;
  }
  .mouth{
    position:absolute;
    bottom:14px; left:50%;
    width:16px; height:8px;
    transform:translateX(-50%);
    border-bottom:3px solid #a65b3d;
    border-radius:0 0 50% 50%;
    opacity:0;
    transition:opacity .6s ease .8s;
  }
  .kid.awake .mouth{ opacity:1; }

  .replay-btn{
    position:absolute;
    top:18px; right:18px;
    z-index:100;
    background:rgba(244,201,93,.15);
    border:1px solid rgba(244,201,93,.6);
    color:var(--glow);
    padding:8px 16px;
    border-radius:20px;
    font-size:.85rem;
    cursor:pointer;
    letter-spacing:.03em;
    backdrop-filter:blur(4px);
    transition:background .2s ease;
  }
  .replay-btn:hover{ background:rgba(244,201,93,.3); }
</style>
</head>
<body>

<div id="stage">

  <button class="replay-btn" id="replayBtn">↻ Replay</button>

  <!-- SCENE 1: globe -->
  <div class="scene active" id="scene-globe">
    <div id="globe-wrap">
      <div class="stars-bg"></div>
      <div id="globe">
        <div class="land"></div>
        <div class="shade"></div>
        <div class="marker" id="marker"></div>
        <div class="beam" id="beam"></div>
      </div>
    </div>
  </div>

  <!-- SCENE 2: house exterior -->
  <div class="scene" id="scene-house">
    <div class="night-sky" id="nightSky">
      <div class="moon"></div>
    </div>
    <div class="house">
      <div class="roof"></div>
      <div class="walls">
        <div class="window"></div>
        <div class="window right"></div>
        <div class="door"></div>
      </div>
    </div>
  </div>

  <!-- SCENE 3: bedroom -->
  <div class="scene" id="scene-room">
    <div class="room-inner">
      <div class="wallpaper" id="wallpaper">
        <div class="frame-glow"></div>
        <div class="chess-piece hero" style="top:14%; left:28%;">♞</div>
        <div class="chess-piece" style="top:10%; left:62%; font-size:2rem;">♟</div>
        <div class="chess-piece" style="top:32%; left:12%; font-size:1.7rem;">♙</div>
        <div class="chess-piece" style="top:34%; left:74%; font-size:2.1rem;">♜</div>
        <div class="sparkle" id="sparkle1" style="top:8%; left:26%;"></div>
        <div class="sparkle" id="sparkle2" style="top:20%; left:40%;"></div>
        <div class="sparkle" id="sparkle3" style="top:5%; left:52%;"></div>
      </div>
      <div class="bed" id="bed">
        <div class="frame"></div>
        <div class="pillow"></div>
        <div class="kid" id="kid">
          <div class="head">
            <div class="hair-back"></div>
            <div class="pigtail left"></div>
            <div class="pigtail right"></div>
            <div class="eye left">
              <div class="ball"></div>
              <div class="lid"></div>
            </div>
            <div class="eye right">
              <div class="ball"></div>
              <div class="lid"></div>
            </div>
            <div class="mouth"></div>
            <div class="sparkle eye-sparkle" id="eyeSparkle1" style="top:26px; left:6px; width:16px; height:16px;"></div>
            <div class="sparkle eye-sparkle" id="eyeSparkle2" style="top:26px; right:6px; width:16px; height:16px;"></div>
          </div>
        </div>
        <div class="blanket"></div>
      </div>
    </div>
  </div>

  <div id="caption"></div>

</div>

<script>
(function(){
  const sceneGlobe = document.getElementById('scene-globe');
  const sceneHouse = document.getElementById('scene-house');
  const sceneRoom  = document.getElementById('scene-room');
  const caption    = document.getElementById('caption');
  const marker     = document.getElementById('marker');
  const beam       = document.getElementById('beam');
  const nightSky   = document.getElementById('nightSky');
  const wallpaper  = document.getElementById('wallpaper');
  const bed        = document.getElementById('bed');
  const kid        = document.getElementById('kid');
  const replayBtn  = document.getElementById('replayBtn');

  let timers = [];
  function after(ms, fn){ timers.push(setTimeout(fn, ms)); }
  function clearTimers(){ timers.forEach(clearTimeout); timers = []; }

  function setCaption(text){
    caption.classList.remove('show');
    after(200, () => {
      caption.textContent = text;
      caption.classList.add('show');
    });
  }

  function placeRandomMarker(){
    const R = 0.42; // fraction of globe radius to keep marker on visible sphere
    const angle = Math.random() * Math.PI * 2;
    const radius = Math.sqrt(Math.random()) * R;
    const x = 50 + Math.cos(angle) * radius * 100;
    const y = 50 + Math.sin(angle) * radius * 100;
    marker.style.left = x + '%';
    marker.style.top = y + '%';
    beam.style.left = x + '%';
    beam.style.bottom = (100 - y) + '%';
    beam.style.top = 'auto';
  }

  function scatterStars(container, count){
    container.querySelectorAll('.twinkle-star').forEach(n => n.remove());
    for(let i=0;i<count;i++){
      const s = document.createElement('div');
      s.className = 'twinkle-star';
      s.style.left = (Math.random()*100) + '%';
      s.style.top = (Math.random()*55) + '%';
      s.style.animationDelay = (Math.random()*2.4) + 's';
      container.appendChild(s);
    }
  }

  function popSparkles(ids){
    ids.forEach((id, i) => {
      const el = document.getElementById(id);
      el.classList.remove('pop');
      void el.offsetWidth;
      after(i * 260, () => el.classList.add('pop'));
    });
  }

  function playSequence(){
    clearTimers();
    // reset states
    [sceneGlobe, sceneHouse, sceneRoom].forEach(s => s.classList.remove('active','leaving'));
    beam.classList.remove('fly');
    wallpaper.classList.remove('spotlight');
    bed.classList.remove('awake');
    kid.classList.remove('awake');

    placeRandomMarker();
    scatterStars(nightSky, 40);

    sceneGlobe.classList.add('active');
    setCaption('Somewhere out there in the world…');

    after(1800, () => {
      beam.classList.add('fly');
      setCaption('A little spark sets off for home…');
    });

    after(3300, () => {
      sceneGlobe.classList.add('leaving');
      sceneHouse.classList.add('active');
      setCaption('Flying home, over the rooftops…');
    });

    after(3600, () => {
      sceneGlobe.classList.remove('active','leaving');
    });

    after(6200, () => {
      sceneHouse.classList.add('leaving');
      sceneRoom.classList.add('active');
      setCaption('Into a cozy little room…');
    });

    after(6500, () => {
      sceneHouse.classList.remove('active','leaving');
    });

    after(8200, () => {
      setCaption('Someone is waking up…');
    });

    after(9200, () => {
      kid.classList.add('awake');
      bed.classList.add('awake');
    });

    after(10400, () => {
      setCaption('Her eyes go wide and shiny…');
      popSparkles(['eyeSparkle1','eyeSparkle2']);
    });

    after(11200, () => {
      wallpaper.classList.add('spotlight');
      popSparkles(['sparkle1','sparkle2','sparkle3']);
      setCaption('She spots her favorite chess wallpaper! ♞');
    });

    after(15000, () => {
      setCaption('The end — she can\'t wait to play. ✨');
    });
  }

  replayBtn.addEventListener('click', playSequence);
  window.addEventListener('load', playSequence);
})();
</script>

</body>
</html>
